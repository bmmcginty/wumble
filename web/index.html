<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wumble</title>
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <main>
    <h1>Wumble</h1>
    <p>Direct WebRTC audio tracks from Mumble. Each speaker remains separate.</p>
    <form id="connect">
      <label>Server <input name="server" required autocomplete="url" placeholder="mumble.example.net" value=""></label>
      <label>Port <input name="port" required type="number" min="1" max="65535" value="64738"></label>
      <label>Username <input name="username" required autocomplete="username" value="wumble"></label>
      <label>Password <input name="password" type="password" autocomplete="current-password"></label>
      <button id="connection-toggle" type="submit">Connect</button>
    </form>
    <p id="status" role="status">Not connected</p>
    <p id="audio-alert" role="alert" hidden><span id="audio-alert-text"></span> <button id="restore-audio" type="button">Restore audio</button></p>
    <label id="channel-control" hidden>Channel <select id="channel" disabled></select></label>
    <section id="speakers" aria-label="Speakers"></section>
    <section id="messages">
      <h2>Messages</h2>
      <div id="message-log" role="log" aria-live="polite" aria-relevant="additions text" aria-label="Message history"></div>
      <form id="message-form">
        <label>Message <input id="message-input" type="text" autocomplete="off" disabled></label>
        <button id="message-send" type="submit" disabled>Send</button>
      </form>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
